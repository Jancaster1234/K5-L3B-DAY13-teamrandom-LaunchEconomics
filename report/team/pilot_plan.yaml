# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
# Mọi số dưới đây lấy từ output `python lab13.py` (nhiem_vu_d, nhiem_vu_a), chạy trong src/.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0.70, 0.75) = 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm → 42 người mỗi nhóm, tổng 84 > 40 người: không đủ.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng = 20m / (1 + (m − 1) × 0,02) luôn < 20 / 0,02 = 1.000 (giới hạn tiệm cận khi m tăng mãi, không bao giờ đạt) < 1.251: không đạt mức 5 điểm dù m lớn bao nhiêu.
#   d) 6 depot mỗi nhóm: n hiệu dụng luôn < 6 / 0,02 = 300 (giới hạn tiệm cận), chỉ 6 cụm (< 20): loại.
#   e) Mức chênh 6 điểm (cần n hiệu dụng 859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m − 1) × 0,02) ≥ 859 → m ≥ 299 yêu cầu mỗi người (DE 6,96) → 5.980 yêu cầu thực tế mỗi nhóm.
#
# Phân biệt các con số cỡ mẫu (dùng thống nhất trong file và hồ sơ):
#   859    = cỡ mẫu hiệu dụng cần mỗi nhóm (tương đương 859 yêu cầu độc lập), trường n_per_arm.
#   299    = số yêu cầu hợp lệ tối thiểu mỗi nhân viên (m).
#   6,96   = hệ số thiết kế DE = 1 + (299 − 1) × 0,02, trường design_effect.
#   20     = số cụm (nhân viên) mỗi nhóm, trường clusters_per_arm.
#   5.980  = số yêu cầu thực tế phải thu mỗi nhóm (20 × 299); 5.980 / 6,96 ≈ 859 hiệu dụng.
#   11.960 = tổng số yêu cầu thực tế của hai nhóm.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, mde 0,06, bốn luật dừng, điều kiện kết thúc, luật gia hạn (tối đa đến 2027-01-29), phương pháp phân tích và ngày 2027-01-15 chốt trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia theo nhân viên 20 + 20 tách được tác động tốt nhưng không đủ mẫu cho 5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chấp nhận mức chênh phát hiện được là 6 điểm (859 hiệu dụng mỗi nhóm = 5.980 yêu cầu thực tế, m ≥ 299 yêu cầu mỗi người).
#   Bất lợi: nếu tác động thật chỉ 5 điểm thì power chỉ còn 0,64 (36% khả năng bỏ sót). Giám đốc vận hành ký chấp nhận trước ngày bắt đầu.
#   Không chọn chia theo yêu cầu (dù đủ 1.251) vì cùng một nhân viên vừa dùng vừa không dùng, tràn tác động cao.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại 4,25% (51/1.200) toàn mẫu; 3,97% (39/982) trong phạm vi noi_dia + hang_nang.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng: cao hơn nhóm đối chứng ≥ 2 điểm, kèm trần tuyệt đối 6%.
#
# Ước lượng thời gian (giả định): 45.000 yêu cầu/tháng chia 40 nhân viên ≈ 1.125 yêu cầu/người/tháng, 82% trong phạm vi
#   (982/1.200) ≈ 920/người/tháng → đạt 299 yêu cầu mỗi người sau khoảng 10 ngày làm việc ở bước 0.50.
#   Bước 0.50 bắt đầu 2026-12-21 → đủ 299 yêu cầu khoảng 2027-01-04 (nghỉ 01/01) → chờ thêm 7 ngày để đo mo_lai_trong_7_ngay
#   → đủ dữ liệu chỉ số chính khoảng 2027-01-11; ngày quyết định 2027-01-15 để dư 4 ngày phân tích.
#
# Điều kiện kết thúc (phương án đề xuất của kế hoạch, viết trước, chỉ dựa vào độ đầy đủ của dữ liệu):
#   Yêu cầu hợp lệ = yêu cầu noi_dia hoặc hang_nang của 40 nhân viên đã bốc thăm, tạo từ bước 0.50, đã qua đủ 7 ngày theo dõi mở lại.
#   Chỉ phân tích chỉ số chính khi đạt cả ba: đủ 20 nhân viên mỗi nhóm; mỗi nhân viên ≥ 299 yêu cầu hợp lệ;
#   mỗi nhóm ≥ 5.980 yêu cầu hợp lệ. Thiếu một điều kiện thì chưa kết luận hiệu quả.
#   Gia hạn: mỗi lần thêm 1 tuần, tối đa 2 lần (2027-01-22, rồi 2027-01-29), chỉ khi thiếu mẫu hoặc thiếu thời gian theo dõi.
#   Không gia hạn hay kết thúc sớm vì chỉ số chính đang thuận lợi hay bất lợi; không ai xem chênh lệch chỉ số chính giữa
#   hai nhóm trước khi đạt điều kiện phân tích, kể cả khi đã gia hạn qua 2027-01-15. Đến 2027-01-29 vẫn thiếu thì ghi "chưa đủ bằng chứng",
#   Giám đốc vận hành quyết định thiết kế lại. Nhân viên nghỉ giữa chừng vẫn được tính vào nhóm đã bốc thăm.
#
# Cách phân tích cuối (tính đến việc chia theo cụm nhân viên):
#   Không coi 11.960 yêu cầu là mẫu độc lập: đơn vị phân tích là nhân viên (cụm), không phải yêu cầu.
#   Phương pháp chính: tính chỉ số chính cho từng nhân viên (40 tỉ lệ); trong mỗi depot lấy trung bình nhóm trợ lý trừ
#   trung bình nhóm đối chứng, rồi gộp các depot theo trọng số số nhân viên (phân tầng theo depot, đúng cách bốc thăm);
#   kiểm định t trên 40 tỉ lệ cấp nhân viên có xét depot, báo khoảng tin cậy 95% của chênh lệch.
#   Kiểm tra bổ sung: hồi quy logistic trên từng yêu cầu, có biến depot và sai số chuẩn theo cụm staff_id.
#   Khác nhau: cấp nhân viên coi mỗi người là một điểm dữ liệu, đơn giản và khớp đúng cách bốc thăm; hồi quy dùng từng
#   yêu cầu rồi chỉnh sai số cho tương quan trong cụm, nhưng với chỉ 40 cụm sai số chuẩn theo cụm dễ bị ước lượng thấp.
#   Vì vậy chọn cấp nhân viên làm chính; hồi quy chỉ để kiểm tra độ vững. Hai cách lệch nhau thì báo cả hai, dùng kết quả chính.
#
# MDE khác ngưỡng ra quyết định:
#   MDE 6 điểm là mức chênh thiết kế đủ mẫu để phát hiện với power 0,80; đây không phải ngưỡng để mở rộng.
#   Đề xuất mở rộng khi đạt cả ba: chênh chỉ số chính > 0 có ý nghĩa ở alpha 0,05 (khoảng tin cậy 95% nằm trên 0);
#   không luật dừng nào bị kích hoạt; chi phí cả hệ thống mỗi yêu cầu tính bằng phút đo thật < 12.000 đ.
#   Không có ý nghĩa thì không kết luận "không có tác động" (power chỉ 0,64 nếu tác động thật là 5 điểm);
#   Giám đốc vận hành chọn giữa No-go và thiết kế lại với nhiều cụm hơn.
#
# Thời gian xem lại: hai ngưỡng có mục đích khác nhau.
#   Mục tiêu thiết kế ≤ 4,8 phút mỗi lần: hoà vốn chi phí mỗi việc thành công của kịch bản B4 bất lợi (xem lại 100%,
#   làm lại 15,3 phút/ca) [simulated], không phải hoà vốn của toàn hệ thống
#   (5,1 phút chỉ đúng khi làm lại 9 phút/ca). Dùng để đặt kế hoạch giảm xem lại theo bậc.
#   Ngưỡng cảnh báo > 5 phút mỗi lần (E2 trong chi_so.md, giữ nguyên): dấu hiệu rủi ro kinh tế cần hành động.
#   Từ 4,8 đến 5 phút là vùng theo dõi: chưa đạt mục tiêu nhưng chưa kích hoạt cảnh báo.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ loai noi_dia và hang_nang, mọi depot (0,22× và 0,69× so với 12.000 đ, simulated, theo A3); loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, thành công 54,4%)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4 → 10 → 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm không đủ mẫu với 40 nhân viên
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng; thực tế cần 5.980 yêu cầu mỗi nhóm, 11.960 cả hai nhóm
    design_effect: 6.96           # m = 299 yêu cầu mỗi người, ICC 0,02
    clusters_per_arm: 20          # 20 nhân viên mỗi nhóm, mỗi người ≥ 299 yêu cầu hợp lệ
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, chia ngẫu nhiên phân tầng theo depot bằng code với seed ghi trước"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, mde 0,06, bốn luật dừng, điều kiện kết thúc (20 nhân viên mỗi nhóm, ≥ 299 yêu cầu hợp lệ mỗi người, ≥ 5.980 mỗi nhóm, đủ 7 ngày theo dõi), luật gia hạn tối đa đến 2027-01-29, phương pháp phân tích cấp nhân viên và ngày quyết định 2027-01-15 chốt trước ngày bắt đầu 2026-12-07"
  # Mẫu Lab 13: NẾU [chỉ số vượt mức] – TRONG [bao lâu] – THÌ [việc cụ thể, ai làm] – KHÔNG THÌ [việc bị cấm khi chưa làm xong vế THÌ].
  # Khi không luật nào bị kích hoạt: giữ bước rollout hiện tại; chỉ sang bước tiếp khi đủ 1 tuần dữ liệu ở bước đó
  # và Giám đốc vận hành phê duyệt. Không có bước nào tự động mở rộng.
  stop_rules:
    - "NẾU có ≥ 1 ca hoàn tiền trùng đã được đối soát sổ cái xác nhận TRONG bất kỳ ngày nào của pilot (xử lý ngay khi xác nhận, không chờ nhiều ngày) THÌ Giám đốc vận hành tắt trợ lý trong 30 phút, chuyển toàn bộ về nhân viên tự làm, Trưởng nhóm kỹ thuật tìm và sửa nguyên nhân KHÔNG THÌ không được bật lại trợ lý khi nguyên nhân chưa được sửa và Giám đốc vận hành chưa phê duyệt"
    - "NẾU tỉ lệ mở lại 7 ngày (chỉ tính trên các yêu cầu đã qua đủ 7 ngày theo dõi) của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm hoặc vượt 6% (hiện tại 3,97% trong phạm vi) TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút, chuyển toàn bộ về nhân viên tự làm và rà 20 trace mở lại KHÔNG THÌ không được bật lại trợ lý hay sang bước rollout tiếp theo khi chưa rà xong nguyên nhân"
    - "NẾU chi phí mỗi việc thành công (chưa cộng cố định, tính riêng theo loai) của cả phạm vi > 8.000 đ (đợt chạy thử 3.414 đ, simulated) hoặc của riêng hang_nang > 12.000 đ, tức đắt hơn nhân viên tự làm (đợt chạy thử 8.221 đ = 0,69×, simulated; noi_dia chiếm 824/982 yêu cầu nên số gộp không lộ ra khi hang_nang xấu đi) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được giữ hang_nang trong phạm vi hay sang bước rollout tiếp theo khi chi phí chưa về dưới 8.000 đ"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) > 40% (đợt chạy thử 27,12%) hoặc dưới 50% yêu cầu của nhóm trợ lý được mở bằng trợ lý TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và báo PM trợ lý hoàn phí KHÔNG THÌ không được sang bước rollout tiếp theo khi chưa có kết quả phỏng vấn và mức sử dụng chưa về trong ngưỡng"
  interim_looks: "Chỉ kiểm tra chỉ số an toàn (mở lại 7 ngày, hoàn trùng) hằng ngày và chi phí, mức độ sử dụng hằng tuần để áp luật dừng; PM trợ lý hoàn phí báo Giám đốc vận hành. Không xem chênh lệch chỉ số chính giữa hai nhóm trước 2027-01-15 và trước khi đạt điều kiện phân tích (gia hạn tối đa đến 2027-01-29)"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như hiện nay (12.000 đ/yêu cầu)"
  decision_date: "2027-01-15"
  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút, 1.780.000 đ)"
    - "phut_lam_lai_simulated (1.132 phút, 2.264.000 đ)"
    - "chi phí mỗi việc thành công 4.472 đ toàn mẫu, 3.414 đ trong phạm vi"
    - "so sánh theo loai với 12.000 đ: noi_dia 0,22×, hang_nang 0,69×, quoc_te 1,88×, doi_tac 0,85×"
    - "toàn bộ dữ liệu logix_runs.csv và logix_requests.csv là dữ liệu giả lập của lab"
